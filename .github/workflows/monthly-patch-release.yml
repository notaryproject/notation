name: Monthly dependency patch release
run-name: 'Monthly patch ${{ inputs.month }} ${{ inputs.plan_id }} #${{ inputs.controller_issue }} attempt ${{ inputs.attempt }}'

on:
  workflow_dispatch:
    inputs:
      mode:
        description: No-write plan, or coordinator-authorized canonical execution
        type: choice
        options: [dry-run, execute]
        default: dry-run
        required: true
      month:
        description: Optional YYYY-MM cycle to inspect or resume (UTC month by default)
        type: string
        required: false
      controller_issue:
        description: Trusted cycle issue in notaryproject/notation, required for execution
        type: string
        required: false
      plan_id:
        description: Approved assessment digest, required for execution
        type: string
        required: false
      attempt:
        description: Dispatched worker attempt, required for execution
        type: string
        required: false

permissions:
  actions: read
  contents: read
  issues: read
  pull-requests: read

jobs:
  release:
    uses: ./.github/workflows/monthly-patch-worker.yml
    with:
      mode: ${{ inputs.mode }}
      month: ${{ inputs.month }}
      controller_issue: ${{ inputs.controller_issue }}
      plan_id: ${{ inputs.plan_id }}
      attempt: ${{ inputs.attempt }}
      worker_sha: ${{ github.sha }}
    secrets:
      MONTHLY_PATCH_TOKEN: ${{ inputs.mode == 'execute' && secrets.MONTHLY_PATCH_TOKEN || '' }}
      MONTHLY_PATCH_SIGNING_KEY: ${{ inputs.mode == 'execute' && secrets.MONTHLY_PATCH_SIGNING_KEY || '' }}
